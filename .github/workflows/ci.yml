name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Third-party actions are pinned to a commit (the tag in the comment): a moved tag cannot change
# what runs with this repository's credentials. Update both together (Dependabot does).
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: varhub_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: Dependency licenses (AGPL-3.0 compatible)
        run: python3 scripts/auditar-licencas.py --npm .
      - run: npm test

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build -t varhub-server:ci .
      - name: The container starts as a non-root user and answers /api/version
        run: |
          test "$(docker run --rm --entrypoint id varhub-server:ci -u)" != "0"
          docker run -d --name api -p 5000:5000 -e JWT_SECRET=ci-only-ci-only-ci-only --entrypoint node varhub-server:ci server.js
          for i in $(seq 1 20); do curl -fs localhost:5000/api/version && break; sleep 1; done
          curl -fs localhost:5000/api/version | grep -q '"version"'

  # Publishes the image to GitHub Packages (ghcr.io). The web repository's Compose file pulls it.
  publish:
    needs: [test, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # ghcr.io/ettorecsenatore/varhub-server
    env:
      IMAGE: ghcr.io/ettorecsenatore/varhub-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login -u "${{ github.actor }}" --password-stdin ghcr.io
      - name: Build and publish
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAGS=(-t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::12}")
          # The version tag points to the first image of that version and is never moved.
          if ! docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            TAGS+=(-t "$IMAGE:$VERSION")
          fi
          docker build --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=AGPL-3.0-or-later" "${TAGS[@]}" .
          docker push --all-tags "$IMAGE"

  # GitHub Release of each new version: after the image is published, the version of package.json
  # (the top of releases.yaml; the tests check they match) gets its tag vX.Y.Z and its release, with
  # the notes from releases.yaml, when they do not exist yet. Nobody has to remember.
  release:
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # tag and release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Release of the new version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already published."
            exit 0
          fi
          node scripts/release-notes.js "$VERSION" --title > title.txt
          node scripts/release-notes.js "$VERSION" > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "$(cat title.txt)" --notes-file notes.md --latest
